name: Promote npm release

on:
  workflow_dispatch:
    inputs:
      soak_run_id:
        description: Successful promotion-soak workflow run ID
        required: true
        type: string
      version:
        description: Exact published version to promote
        required: true
        type: string
      confirmation:
        description: Type "promote <version> to latest" to authorize promotion
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    steps:
      - id: soak
        name: Verify completed soak run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.soak_run_id }}
          VERSION: ${{ inputs.version }}
        run: |
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .conclusion)"
          event="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .event)"
          name="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .name)"
          head_branch="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_branch)"
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)"
          if [[ "$conclusion" != "success" || "$event" != "workflow_dispatch" || "$name" != "Promotion soak" ]]; then
            echo "Run $RUN_ID is not a successful manually dispatched promotion soak" >&2
            exit 1
          fi
          if [[ "$head_branch" != "v$VERSION" ]]; then
            echo "Run $RUN_ID soaked $head_branch, not v$VERSION" >&2
            exit 1
          fi
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
      - name: Verify explicit promotion confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$CONFIRMATION" != "promote $VERSION to latest" ]]; then
            echo "Confirmation must exactly match: promote $VERSION to latest" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify the soak commit is still the release tag
        env:
          SOAK_SHA: ${{ steps.soak.outputs.head_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          tag_sha="$(git rev-list -n 1 "v$VERSION")"
          if [[ "$tag_sha" != "$SOAK_SHA" ]]; then
            echo "v$VERSION resolves to $tag_sha, but the soak ran at $SOAK_SHA" >&2
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Use the pinned release npm CLI
        run: npm install --global npm@11.18.0
      - run: npm ci --ignore-scripts
      - name: Promote the complete package set
        run: >-
          npm run release:promote --
          --version=${{ inputs.version }}
          --promote
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PROMOTION_TOKEN }}
